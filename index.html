.hidden-controls{display:none}

<script>
const freq=m=>440*Math.pow(2,(m-69)/12);
let ctx,master,body,dry,wet,echo,echoIn,verbIn;
const SBUF={},loading={};
const instId=()=>document.getElementById('inst').value;
const INST=()=>INSTRUMENTS[instId()];
function loadSamples(){
  const id=instId();
  if(!loading[id]){SBUF[id]={};loading[id]=Promise.all(Object.entries(INSTRUMENTS[id].data).map(async([m,u])=>{
    const bin=atob(u.split(',')[1]),arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    try{SBUF[id][m]=await ctx.decodeAudioData(arr.buffer)}catch(e){}
  }));}
  return loading[id];
}
// Sala sintética: ruido estéreo decorrelado con caída exponencial y primeras reflexiones
function makeIR(sec){
  // Cola de sala lisa y difusa, sin reflexiones sueltas (evita que las notas suenen "dobles").
  const sr=ctx.sampleRate,len=Math.floor(sr*sec),b=ctx.createBuffer(2,len,sr);
  const T60L=2.4,T60H=.85;
  for(let c=0;c<2;c++){const d=b.getChannelData(c);let lo=0;
    for(let i=0;i<len;i++){const t=i/sr,n=Math.random()*2-1;
      lo+=.04*(n-lo);const hi=n-lo;
      d[i]=(lo*3*Math.exp(-6.9*t/T60L)+hi*.45*Math.exp(-6.9*t/T60H))*(1-Math.exp(-t/.06));}
  }
  return b;
}
function applyFx(){
  if(!ctx)return;const v=+document.getElementById('fx').value/100;
  const e=+document.getElementById('echoAmt').value/100;
  wet.gain.value=v*1.0;dry.gain.value=1-v*.25;echo.gain.value=e*.55;
}
function audio(){
  if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;
    try{ctx=new AC({latencyHint:'playback',sampleRate:48000})}catch(e){ctx=new AC()}
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=2;comp.knee.value=12;comp.attack.value=.02;comp.release.value=.3;
    const lim=ctx.createDynamicsCompressor();lim.threshold.value=-2;lim.ratio.value=20;lim.knee.value=0;lim.attack.value=.002;lim.release.value=.1;
    master=ctx.createGain();master.gain.value=.85;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=8000;
    lp.frequency.value=12000;
    master.connect(lp);lp.connect(comp);comp.connect(lim);lim.connect(ctx.destination);
    // cuerpo de caparazón de tortuga: medios cálidos y brillo de cuerda de tripa
    // caja de guitarra acústica: resonancia de aire (~100 Hz), tapa (~210 Hz), menos "caja" en 450 Hz y presencia de acero
    body=ctx.createBiquadFilter();body.type='highpass';body.frequency.value=70;body.Q.value=.6;
    const chain=[['peaking',180,1.2,1],['peaking',450,1.2,-.5]];
    let node=body;
    chain.forEach(([t,fq,q,gn])=>{const b=ctx.createBiquadFilter();b.type=t;b.frequency.value=fq;b.Q.value=q;b.gain.value=gn;node.connect(b);node=b;});
    const shine=ctx.createBiquadFilter();shine.type='highshelf';shine.frequency.value=6000;shine.gain.value=1;
    node.connect(shine);
    dry=ctx.createGain();shine.connect(dry);dry.connect(master);
    // reverberación amplia
    const conv=ctx.createConvolver();verbIn=conv;conv.buffer=makeIR(3.5);
    wet=ctx.createGain();shine.connect(conv);conv.connect(wet);wet.connect(master);
    // eco ping-pong izquierda/derecha que alimenta también la reverb
    echo=ctx.createGain();
    const tone2=ctx.createBiquadFilter();tone2.type='lowpass';tone2.frequency.value=1800;echoIn=tone2;
    const dl=ctx.createDelay(2),dr=ctx.createDelay(2),fb=ctx.createGain(),pl=ctx.createStereoPanner(),pr=ctx.createStereoPanner();
    dl.delayTime.value=.27;dr.delayTime.value=.16;fb.gain.value=.3;pl.pan.value=-.55;pr.pan.value=.55;
    shine.connect(echo);echo.connect(tone2);tone2.connect(dl);dl.connect(pl);dl.connect(dr);dr.connect(pr);dr.connect(fb);fb.connect(tone2);
    pl.connect(master);pr.connect(master);pl.connect(conv);pr.connect(conv);
    loadSamples();
    applyFx();}
  if(ctx.state==='suspended')ctx.resume();
  return ctx;
}
// Cuerda pulsada (Karplus-Strong): ruido filtrado que circula por una línea de retardo del largo de la cuerda
const KS={};
// Versión de alta calidad: afinación exacta con retardo fraccionario, dos cuerdas por nota
// ligeramente desafinadas (izquierda/derecha), forma de pulsación triangular y caída según el registro.
function ksBuf(m){
  if(KS[m])return KS[m];
  const sr=ctx.sampleRate,f=freq(m),len=Math.floor(sr*6),buf=ctx.createBuffer(2,len,sr);
  const T60=Math.max(2.4,4.6-(m-43)*.1);
  [-.7,.7].forEach((cents,c)=>{
    const d=buf.getChannelData(c);
    const P=sr/(f*Math.pow(2,cents/1200)),D=P-.5,g=Math.pow(10,-3/(T60*f));
    // excitación: triángulo con el punto de pulsación cerca del puente + un poco de ruido suave
    // púa sobre cuerda de acero: pulsación cerca de la boca de la guitarra, ataque más brillante
    const beta=.19+c*.02,ex=new Float32Array(Math.ceil(P));let lp=0,mean=0;
    for(let i=0;i<ex.length;i++){
      const x=i/P,tri=x<beta?x/beta:(1-x)/(1-beta);
      lp+=.6*((Math.random()*2-1)-lp);
      ex[i]=tri*.8+lp*.4;mean+=ex[i];
    }
    mean/=ex.length;for(let i=0;i<ex.length;i++)ex[i]-=mean;
    for(let n=0;n<len;n++){
      let fb=0;const pos=n-D;
      if(pos>=2){const i0=Math.floor(pos),fr=pos-i0;
        const a=d[i0]+(d[i0+1]-d[i0])*fr, b=d[i0-1]+(d[i0]-d[i0-1])*fr;
        fb=g*.5*(a+b);}
      d[n]=(n<ex.length?ex[n]:0)+fb;
    }
    // quitar DC, suavizar el ataque y normalizar
    let px=0,py=0,peak=0;
    for(let n=0;n<len;n++){const y=d[n]-px+.995*py;px=d[n];py=y;d[n]=y;peak=Math.max(peak,Math.abs(y));}
    const fade=Math.floor(sr*.0015),k=.9/(peak||1);
    for(let n=0;n<len;n++)d[n]*=k*(n<fade?n/fade:1);
  });
  return KS[m]=buf;
}
function tone(m,start,dur,vel=.32,send=0,vsend=0,relOv=0){
  const I=INST(),R=relOv||I.rel,bufs=SBUF[instId()]||{},courses=I.courses||[[0,0,0,1]];
  const g=ctx.createGain(),amp=vel*.95*(.92+Math.random()*.16),p=ctx.createStereoPanner();
  p.pan.value=Math.max(-.3,Math.min(.3,(m-53)/20));
  g.gain.setValueAtTime(amp,start);
  g.gain.setValueAtTime(amp,start+dur);
  g.gain.exponentialRampToValueAtTime(.0001,start+dur+R);
  g.connect(p);p.connect(body);
  // envío extra al eco para notas que deben dejar estela
  if(send){const sg=ctx.createGain();sg.gain.value=send;p.connect(sg);sg.connect(echoIn);}
  if(vsend){const vg=ctx.createGain();vg.gain.value=vsend;p.connect(vg);vg.connect(verbIn);}
  // cada "orden" es una cuerda: desplazamiento en semitonos, desafinación en cents, retraso y volumen
  courses.forEach(([semi,cents,delay,gain])=>{
    const src=ctx.createBufferSource(),cg=ctx.createGain();
    src.buffer=bufs[m+semi]||bufs[m]||ksBuf(m);
    src.detune.value=cents+(bufs[m+semi]?0:semi*100);
    cg.gain.value=gain;src.connect(cg);cg.connect(g);
    src.start(start+delay);src.stop(start+dur+R+.05);live.push(src);
  });
  return g;

function swellTo(v,secs){const g=amb.swell.gain,t=ctx.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(v,t+secs);}
function heartbeat(){
  if(state!=='full')return;
  const t=ctx.currentTime+.02,held=t-fullAt;
  [0,.24].forEach((o,k)=>{const bt=t+o,os=osc('sine',58,bt,bt+.5);os.frequency.exponentialRampToValueAtTime(36,bt+.3);
    const g=ctx.createGain();g.gain.setValueAtTime(0,bt);g.gain.linearRampToValueAtTime(k?.4:.55,bt+.01);g.gain.exponentialRampToValueAtTime(.0001,bt+.45);os.connect(g);g.connect(master);});
  heartTimer=setTimeout(heartbeat,Math.max(.55,1.15-held*.06)*1000);
}
function creak(){ // la madera del arco cruje al doblarse
  const t=ctx.currentTime,ns=ctx.createBufferSource();ns.buffer=getNoise();ns.playbackRate.value=.25;
  const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(200,t);bp.frequency.linearRampToValueAtTime(650,t+FULL);bp.Q.value=6;
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+FULL*.8);g.gain.linearRampToValueAtTime(0,t+FULL+.4);
  ns.connect(bp);bp.connect(g);g.connect(body);ns.start(t);ns.stop(t+FULL+.5);live.push(ns);
}
function bowThrum(t){ // la cuerda del arco: un zumbido grave que canta junto al acorde
  [31,43].forEach((m,k)=>{const src=ctx.createBufferSource();src.buffer=ksBuf(m);
    const g=ctx.createGain();g.gain.setValueAtTime(k?.18:.42,t);g.gain.exponentialRampToValueAtTime(.0001,t+5.5);
    src.connect(g);g.connect(body);src.start(t);src.stop(t+5.6);live.push(src);});
}
async function press(){
  if(state!=='idle')return;
  audio();startAmbient();await loadSamples();
  if(state!=='idle')return;
  state='drawing';cv.classList.add('held');setHint('',false);
  pressT=ctx.currentTime+.05;fullAt=pressT+FULL;
  heldNotes=[
    tone(43,pressT,FULL,.3),tone(58,pressT+.045,FULL,.3),        // Sol + Si♭, sostenidos
    tone(63,pressT+SPB,SPB,.36,0,0,.05),                          // Mi♭
    tone(62,pressT+2*SPB,12,.36)                                  // Re, sigue sonando mientras sostienes
  ];
  swellTo(2.1,FULL);
}
function release(){
  if(state==='drawing'){            // soltó antes de tiempo: el arco se relaja y todo se apaga
    state='relaxing';cv.classList.remove('held');
    const t=ctx.currentTime;heldNotes.forEach(g=>{try{g.gain.cancelScheduledValues(t);g.gain.setTargetAtTime(0,t,.15)}catch(e){}});
    swellTo(1,2.5);setHint(hintHTML('early'));
    return;
  }
  if(state!=='full')return;
  state='fired';cv.classList.remove('held');clearTimeout(heartTimer);firedAt=performance.now();
  const t=ctx.currentTime+.01;
  heldNotes.forEach(g=>{try{g.gain.cancelScheduledValues(t);g.gain.setTargetAtTime(0,t,.04)}catch(e){}});
  [43,48,60].forEach((m,k)=>tone(m,t+k*.012,4*SPB,1));   // acorde final: Sol + Do + Do
  const g=amb.swell.gain;g.cancelScheduledValues(t);g.setValueAtTime(1.6,t);g.linearRampToValueAtTime(1,t+(4+1.5)*SPB);
  flash=reduce?0:.7;shake=reduce?0:.8;vib=1;arrowX=0;arrowV=.02;arrowA=1;
  for(let k=0;k<4;k++)waves.push({r:0,d:k*.09,a:.45-k*.08});
  setHint('',false);
  setTimeout(()=>{state='idle';arrowX=0;arrowV=0;arrowA=0;setHint(hintHTML('idle'));},7000);
}

   c.save();c.beginPath();[[294,214],[350,206],[405,199],[432,195],[432,224],[400,222],[350,238],[294,248]].forEach((q,n)=>n?c.lineTo(q[0]*k,q[1]*k):c.moveTo(q[0]*k,q[1]*k));c.closePath();c.clip();c.fillStyle=g;c.fillRect(0,0,w,h);c.restore();}
  // piernas: sombra en el lado de la espalda de cada pantorrilla
  soft(384,505,12,34,-.45,.4);soft(194,520,11,36,.1,.38);soft(372,462,9,20,-.3,.3);
  c.globalCompositeOperation='source-atop';
  c.strokeStyle='#150b07';c.lineCap='round';c.lineJoin='round';
  const ink=(pts,wd,al=.85)=>{c.globalAlpha=al;c.lineWidth=wd*k;c.beginPath();c.moveTo(pts[0][0]*k,pts[0][1]*k);
    if(pts.length===2)c.lineTo(pts[1][0]*k,pts[1][1]*k);
    else if(pts.length===3){const qx=2*pts[1][0]-(pts[0][0]+pts[2][0])/2,qy=2*pts[1][1]-(pts[0][1]+pts[2][1])/2;c.quadraticCurveTo(qx*k,qy*k,pts[2][0]*k,pts[2][1]*k);}
    else{for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;c.quadraticCurveTo(pts[i][0]*k,pts[i][1]*k,(i===pts.length-2?pts[i+1][0]:mx)*k,(i===pts.length-2?pts[i+1][1]:my)*k);}}
    c.stroke();c.globalAlpha=1;};
  // clavículas y hueco yugular
  ink([[255,231],[272,229],[291,233]],1.1,.8);ink([[254,232],[236,229],[218,235]],1.0,.7);
  // pectorales: borde inferior, surco del esternón y línea axilar
  ink([[258,264],[274,272],[291,262]],1.3);ink([[253,264],[236,272],[216,262]],1.3);
  ink([[255,237],[256,252],[255,268]],1.0,.7);
  ink([[217,251],[214,260],[218,268]],.9,.6);
  // abdomen: línea alba, recto abdominal con sus intersecciones tendinosas y los bordes laterales
  ink([[255,270],[256,296],[254,320]],1.0,.8);
  ink([[240,284],[255,286],[270,284]],1.0,.75);ink([[239,297],[255,299],[271,297]],1.0,.7);ink([[240,310],[255,312],[270,310]],1.0,.65);
  ink([[236,274],[233,298],[236,322]],1.05,.75);ink([[275,274],[277,298],[273,322]],1.05,.7);
  // serratos y oblicuos del flanco, cresta ilíaca sobre el cinturón
  [[205,262,217,268],[204,273,216,279],[205,284,215,289],[207,295,216,299]].forEach(([x0,y0,x1,y1])=>ink([[x0,y0],[(x0+x1)/2,(y0+y1)/2-1],[x1,y1]],.9,.65));
  ink([[222,308],[232,316],[238,326]],1.0,.7);ink([[288,300],[281,312],[276,324]],1.0,.65);
  // brazo del arco: deltoides, bíceps, pliegue del codo y masas del antebrazo
  ink([[312,222],[321,230],[331,226]],1.1,.75);
  ink([[301,239],[318,235],[334,230]],1.0,.8);
  ink([[300,226],[316,222],[332,216]],.9,.55);
  ink([[336,214],[341,224],[337,234]],1.1,.85);
  ink([[346,214],[370,212],[396,207]],1.0,.75);
  ink([[344,222],[368,219],[393,213]],1.0,.8);
  ink([[346,231],[372,226],[397,217]],1.0,.7);
  ink([[400,208],[404,214],[402,220]],1.0,.8);
  // piernas: rótula, músculos de la pantorrilla y tibia
  ink([[366,476],[372,484],[378,478]],1.0,.7);
  ink([[377,508],[388,524],[395,541]],1.2,.8);ink([[386,498],[397,520],[402,540]],1.1,.7);ink([[371,512],[381,524],[390,542]],1.0,.65);
  ink([[188,492],[193,510],[190,528]],1.1,.75);ink([[181,505],[184,520],[182,538]],1.0,.6);
  // luz cálida desde arriba a la izquierda, como barro cocido
  c.globalCompositeOperation='source-atop';
  const lg=c.createLinearGradient(0,0,w,h);lg.addColorStop(0,'rgba(255,214,160,.28)');lg.addColorStop(.55,'rgba(0,0,0,0)');lg.addColorStop(1,'rgba(20,6,0,.45)');
  c.fillStyle=lg;c.fillRect(0,0,w,h);
}
addEventListener('resize',()=>{figKey='';});
const ease=x=>1-Math.pow(1-x,3);
const clamp01=x=>Math.max(0,Math.min(1,x));
function frame(now){
  const t=ctx?ctx.currentTime:0;
  if(state==='drawing'){draw=Math.min(1,(t-pressT)/FULL);if(t>=fullAt){state='full';setHint(hintHTML('full'),true);heartbeat();}}
  else if(state==='full'){draw=1;}
  else if(state==='relaxing'){draw+=(0-draw)*.07;if(draw<.003){draw=0;state='idle';}}
  else if(state==='fired'){}
  else{draw+=(0-draw)*.02;}
  // tirar de la cuerda hasta la cara durante toda la secuencia
  const s2=state==='fired'?0:ease(clamp01(draw));
  const held=state==='full'?(t-fullAt):0;
  const tension=state==='fired'?.3:draw;
  layout();buildFigure();

  g2.fillStyle='#060508';g2.fillRect(0,0,W,H);
  const cx=FX+FIG_W*S*.5,cy=FY+FIG_H*S*.45,R=FIG_H*S;
  const lg=g2.createRadialGradient(cx,cy-R*.1,0,cx,cy,Math.max(W,H)*(.5+tension*.15));
  lg.addColorStop(0,`rgba(${120+tension*40|0},${92+tension*20|0},${62},${.22+tension*.22})`);lg.addColorStop(1,'rgba(6,5,8,0)');
  g2.fillStyle=lg;g2.fillRect(0,0,W,H);

  dust.forEach(d=>{const sp=(1-tension*.9)*.00022*d.z;d.y-=sp;d.x+=Math.sin(now/3200+d.z*9)*.0001;
    if(d.y<-.02)d.y=1.02;
    const jx=vib>0?(Math.random()-.5)*6*vib*d.z:0;
    g2.fillStyle=`rgba(230,214,190,${.07+d.z*.16})`;g2.beginPath();g2.arc(d.x*W+jx,d.y*H,d.z*1.5,0,7);g2.fill();});

  let ox=0,oy=0;
  if(!reduce&&state==='full'){const a=.5+Math.min(held,8)*.45;ox=(Math.random()-.5)*a;oy=(Math.random()-.5)*a;}
  if(shake>0){ox+=(Math.random()-.5)*24*shake;oy+=(Math.random()-.5)*24*shake;shake*=.9;if(shake<.01)shake=0;}
  g2.save();g2.translate(ox,oy);

  // sombra en el suelo y figura
  const sh=g2.createRadialGradient(cx,FY+FIG_H*S*.985,0,cx,FY+FIG_H*S*.985,FIG_W*S*.42);
  sh.addColorStop(0,'rgba(0,0,0,.6)');sh.addColorStop(1,'rgba(0,0,0,0)');
  g2.save();g2.translate(0,FY+FIG_H*S*.985);g2.scale(1,.12);g2.translate(0,-(FY+FIG_H*S*.985));g2.fillStyle=sh;g2.fillRect(cx-FIG_W*S*.5,FY+FIG_H*S*.5,FIG_W*S,FIG_H*S);g2.restore();
  if(figCanvas){g2.save();g2.shadowColor=`rgba(255,170,110,${.1+tension*.25})`;g2.shadowBlur=30*tension;g2.drawImage(figCanvas,FX,FY,FIG_W*S,FIG_H*S);g2.restore();}
  // brazo: sigue la cuerda; tras soltar se queda atrás un momento y vuelve despacio
  armP=state==='fired'?armP*.985:s2;
  const lxv=A_TOP.x+(A_BOT.x-A_TOP.x)*((A_HAND.y-A_TOP.y)/(A_BOT.y-A_TOP.y));
  if(figCanvas)drawArm({x:lxv+(A_HAND.x-lxv)*armP,y:A_HAND.y},g2);

  // cuerda trenzada
  const K=S*1.25;
  const top=P(A_TOP),bot=P(A_BOT),hand=P(A_HAND);
  const quadPts=(a,c,b,n)=>{const r=[];for(let i=0;i<=n;i++){const u=1-i/n,v=i/n;r.push({x:u*u*a.x+2*u*v*c.x+v*v*b.x,y:u*u*a.y+2*u*v*c.y+v*v*b.y});}return r;};
  const linePts=(arr,n)=>{const r=[];for(let k=0;k<arr.length-1;k++){const a=arr[k],b=arr[k+1];for(let i=(k?1:0);i<=n;i++){const v=i/n;r.push({x:a.x+(b.x-a.x)*v,y:a.y+(b.y-a.y)*v});}}return r;};
  const drawString=(pts,alpha,glow,detail)=>{
    g2.lineCap='round';g2.lineJoin='round';
    const path=()=>{g2.beginPath();pts.forEach((p,i)=>i?g2.lineTo(p.x,p.y):g2.moveTo(p.x,p.y));};
    if(detail){g2.save();g2.translate(2*K,3*K);path();g2.strokeStyle=`rgba(0,0,0,${.45*alpha})`;g2.lineWidth=2.4*K;g2.filter='blur(2px)';g2.stroke();g2.restore();}
    g2.shadowColor=`rgba(255,214,160,${glow})`;g2.shadowBlur=glow*26;
    path();g2.strokeStyle=`rgba(232,218,192,${alpha})`;g2.lineWidth=1.7*K;g2.stroke();g2.shadowBlur=0;
    if(!detail)return;
    path();g2.setLineDash([1.6*K,2*K]);g2.strokeStyle=`rgba(96,80,58,${.6*alpha})`;g2.lineWidth=1.7*K;g2.stroke();g2.setLineDash([]);
    g2.save();g2.translate(-.5*K,-.3*K);path();g2.strokeStyle=`rgba(255,248,230,${.45*alpha})`;g2.lineWidth=.5*K;g2.stroke();g2.restore();
  };
  const loopAt=(p,a)=>{g2.strokeStyle=`rgba(232,218,192,${a})`;g2.lineWidth=1.3*K;g2.beginPath();g2.ellipse(p.x,p.y,3.6*K,4.6*K,0,0,7);g2.stroke();};

  const fs=performance.now()-firedAt;
  if(state==='fired'||vib>0){vib=Math.max(0,1-fs/6500);}
  const midY=(top.y+bot.y)/2,midX=(top.x+bot.x)/2;
  const lineX=top.x+(bot.x-top.x)*((hand.y-top.y)/(bot.y-top.y));
  const N={x:lineX+(hand.x-lineX)*s2,y:hand.y};              // punto donde la flecha toca la cuerda
  if(vib>0){
    const amp=FIG_H*S*.04*Math.pow(vib,1.6);
    for(let k=4;k>=0;k--){const ph=now/7+k*1.3,off=Math.sin(ph)*amp+Math.sin(ph*2.1)*amp*.25;
      drawString(quadPts(top,{x:midX+off*2,y:midY},bot,40),k?.18:1,k?.3*vib:.3+.6*vib,!k);}
  }else drawString(linePts([top,N,bot],24),1,.55*tension,true);
  loopAt(top,1);loopAt(bot,1);

  // flecha: apoyada en la mano del arco, con el culatín en la cuerda; al soltar sale volando
  {const G=P(A_GRIP),dx=G.x-N.x,dy=G.y-N.y,dl=Math.hypot(dx,dy),ux=dx/dl,uy=dy/dl,L=A_ARROW*S;
    if(state==='fired'){arrowV*=1.09;arrowX+=arrowV*W;}
    else if(arrowA<1)arrowA=Math.min(1,arrowA+.015);
    const a0=state==='fired'?{x:lineX+ux*arrowX,y:hand.y+uy*arrowX}:N;
    const al=state==='fired'?Math.max(0,1-arrowX/(W*1.4)):arrowA;
    if(al>0){
      g2.save();g2.globalAlpha=al;g2.translate(a0.x,a0.y);g2.rotate(Math.atan2(uy,ux));
      if(state==='fired'){const tr=g2.createLinearGradient(-W*.5,0,0,0);tr.addColorStop(0,'rgba(255,170,110,0)');tr.addColorStop(1,'rgba(255,200,150,.55)');
        g2.strokeStyle=tr;g2.lineWidth=2*K;g2.beginPath();g2.moveTo(-Math.min(W*.5,arrowX),0);g2.lineTo(0,0);g2.stroke();}
      g2.shadowColor=`rgba(255,170,110,${.4*tension})`;g2.shadowBlur=12*tension;
      g2.strokeStyle='#c4683a';g2.lineWidth=2.2*K;g2.beginPath();g2.moveTo(0,0);g2.lineTo(L,0);g2.stroke();
      g2.fillStyle='#c4683a';
      [-1,1].forEach(sg=>{g2.beginPath();g2.moveTo(4*K,0);g2.lineTo(26*K,0);g2.lineTo(8*K,sg*6*K);g2.closePath();g2.fill();});
      g2.beginPath();g2.moveTo(L+16*K,0);g2.lineTo(L-2*K,-5*K);g2.lineTo(L+2*K,0);g2.lineTo(L-2*K,5*K);g2.closePath();g2.fill();
      g2.restore();
    }
  }
  g2.restore();
  const waveC={x:midX,y:midY};

  // ondas de sonido que salen de la cuerda
  waves=waves.filter(w=>w.a>0);
  waves.forEach(w=>{if(w.d>0){w.d-=.016;return;}w.r+=Math.max(W,H)*.006;w.a-=.004;
    g2.strokeStyle=`rgba(236,214,180,${Math.max(0,w.a)*.5})`;g2.lineWidth=1.2;
    g2.beginPath();g2.ellipse(waveC.x,waveC.y,w.r*.55,w.r,0,0,7);g2.stroke();});
  if(flash>0){g2.fillStyle=`rgba(255,240,222,${flash})`;g2.fillRect(0,0,W,H);flash*=.85;if(flash<.01)flash=0;}

  // grano y viñeta, como en película
  g2.save();g2.globalAlpha=.055;g2.globalCompositeOperation='overlay';g2.translate(Math.random()*160,Math.random()*160);g2.fillStyle=grainPat;g2.fillRect(-160,-160,W+320,H+320);g2.restore();
  const vg=g2.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,`rgba(0,0,0,${.78+tension*.12})`);g2.fillStyle=vg;g2.fillRect(0,0,W,H);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
